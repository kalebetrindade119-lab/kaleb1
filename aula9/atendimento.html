<main>
<main>
    <h2>Atendimento ao cliente</h2>

    <section class="formulario">

        <fieldset id="areaFormulario">

            <legend>Fale conosco</legend>

            <label for="nomeAtendimento">
                Nome:
            </label>
            <input type="text" id="nomeAtendimento">

            <label for="idade">
                Idade:
            </label>
            <input type="number" id="idade">

            <label for="assunto">
                Assunto:
            </label>

            <select id="assunto">
                <option>Dúvida sobre produto</option>
                <option>Problema com compra</option>
                <option>Outros</option>
            </select>

            <label for="mensagemAtendimento">
                Mensagem:
            </label>

            <textarea id="mensagemAtendimento"></textarea>

            <button onclick="enviarMensagem()">
                Enviar mensagem
            </button>

            <button onclick="destacarAtendimento()">
                Destacar atendimento
            </button>

            <p id="resposta"></p>

            <p id="respostaIdade"></p>

        </fieldset>

    </section>
</main>
